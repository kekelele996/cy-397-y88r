name: contractapi

services:
  mysql:
    image: mysql:8.0
    container_name: contractapi-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-contractapi}
      MYSQL_USER: ${DB_USER:-contract}
      MYSQL_PASSWORD: ${DB_PASSWORD:-contract_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - contractapi

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractapi-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: "8080"
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-contract}
      DB_PASSWORD: ${DB_PASSWORD:-contract_secret}
      DB_NAME: ${DB_NAME:-contractapi}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
    ports:
      - "${BACKEND_PORT:-19412}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - contractapi

volumes:
  mysql_data:

networks:
  contractapi:
